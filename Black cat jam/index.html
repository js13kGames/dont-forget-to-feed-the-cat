// Vertex shader
var vshader = `
attribute vec4 position; 
attribute vec4 color;
attribute vec4 normal;
uniform mat4 mvp;
uniform mat4 model;            // model matrix
uniform mat4 inverseTranspose; // inversed transposed model matrix
varying vec4 v_color;
varying vec3 v_normal;
varying vec3 v_position;
void main() {

  // Apply the model matrix and the camera matrix to the vertex position
  gl_Position = mvp * position;
  
  // Set varying position for the fragment shader
  v_position = vec3(model * position);
  
  // Recompute the face normal
  v_normal = normalize(vec3(inverseTranspose * normal));
  
  // Set the color
  v_color = color;
}`;

// Fragment shader
var fshader = `
precision mediump float;
uniform vec3 lightColor;
uniform vec3 lightPosition;
uniform vec3 ambientLight;
varying vec3 v_normal;
varying vec3 v_position;
varying vec4 v_color;
void main() {

  // Compute direction between the light and the current point
  vec3 lightDirection = normalize(lightPosition - v_position);
  
  // Compute angle between the normal and that direction
  float nDotL = max(dot(lightDirection, v_normal), 0.0);
  
  // Compute diffuse light proportional to this angle
  vec3 diffuse = lightColor * v_color.rgb * nDotL;
  
  // Compute ambient light
  vec3 ambient = ambientLight * v_color.rgb;
  
  // Compute total light (diffuse + ambient)
  gl_FragColor = vec4(diffuse + ambient, 1.0);
}`;

// Compile program
var program = compile(gl, vshader, fshader);

// Initialize a cube
var vertices, normals, indices;
[vertices, normals, indices] = cube();

// Count vertices
var n = indices.length;

// Set position, normal buffers

// Set indices
var indexBuffer = gl.createBuffer();

gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);

// Set the clear color and enable the depth test

// Keydown listener
onkeydown = (e) => {

  // Up (up / W / Z)
  if(e.keyCode == 38 || e.keyCode == 90 || e.keyCode == 87){
    up = true;
  }
  
  // Right (right / D)
  if(e.keyCode == 39 || e.keyCode == 68){
    right = true;
  }
  
  // Down (down / S)
  if(e.keyCode == 40 || e.keyCode == 83){
    down = true;
  }
  
  // Left (left / A / Q)
  if(e.keyCode == 37 || e.keyCode == 65 ||e.keyCode == 81){
    left = true;
  }

  // Jump (space)
  if(e.keyCode == 32){
    jump = true;
  }

  // Restart
  if(e.keyCode==82){
    location.reload();
  }
}

// Keyup listener
onkeyup = (e) => {
    
  // Up
  if(e.keyCode == 38 || e.keyCode == 90 || e.keyCode == 87){
    up = false;
  }
  
  // Right
  if(e.keyCode == 39 || e.keyCode == 68){
    right = false;
  }
  
  // Down
  if(e.keyCode == 40 || e.keyCode == 83){
    down = false;
  }
  
  // Left
  if(e.keyCode == 37 || e.keyCode == 65 || e.keyCode == 81){
    left = false;
  }
  // Jump (space)
  if(e.keyCode == 32){
    jump = false;
  }
}


// Render a cube
renderCube = (cx, cy, cz, tx, ty, tz, sx, sy, sz) => {
  // Set cube color
  var color = gl.getAttribLocation(program, 'color');
  gl.vertexAttrib3f(color, cx, cy, cz);

  // Set the model matrix
  var modelMatrix = new DOMMatrix();
  modelMatrix.translateSelf(tx, ty, tz).scaleSelf(sx, sy, sz)
  var model = gl.getUniformLocation(program, 'model');
  gl.uniformMatrix4fv(model, false, modelMatrix.toFloat32Array());

  // Set the cube's mvp matrix (camera x model)
  var mvpMatrix = (new DOMMatrix(modelMatrix)).preMultiplySelf(cameraMatrix);
  var mvp = gl.getUniformLocation(program, 'mvp');
  gl.uniformMatrix4fv(mvp, false, mvpMatrix.toFloat32Array());

  // Set the inverse transpose of the model matrix
  var inverseTransposeMatrix = transpose((new DOMMatrix(modelMatrix)).invertSelf());
  var inverseTranspose = gl.getUniformLocation(program, 'inverseTranspose');
  gl.uniformMatrix4fv(inverseTranspose, false, inverseTransposeMatrix.toFloat32Array());

  // Render
  gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0);
}

}

resizeCanvasToDisplaySize = (canvas) => {
  // Lookup the size the browser is displaying the canvas in CSS pixels.
  const displayWidth  = canvas.clientWidth;
  const displayHeight = canvas.clientHeight;
  
  // Check if the canvas is not the same size.
  const needResize = canvas.width  !== displayWidth ||
                      canvas.height !== displayHeight;
  
  if (needResize) {
    // Make the canvas the same size
    canvas.width  = displayWidth;
    canvas.height = displayHeight;
  }
  
  return needResize;
}

m.push([0.5,0.5,0.5,a,b,c,w,r,h]); // add start floor to m
for (l=0;l<40;l++){
  e=Math.floor(Math.random()*f.length);
  a=f[e][0];
  b=f[e][1];
  c=f[e][2];
  w=f[e][3];
  h=f[e][4];
  for (p=0;p<4;p++){
    d1=d[p][0];
    d2=d[p][1];
    if (findBlock(a+(w+2*g)*d1,b,c+(h+2*g)*d2,2*g,g,2*g)){
      u[p]=true;
    } else {
      u[p]=false;
    }
  }
  j=Math.floor(Math.random()*4); // direction
  if (!u[j]){
    i=Math.floor(Math.random()*2)+2; // stair height
    k=Math.round(Math.random())*2-1; // stairs going up or down
    d1=d[j][0];
    d2=d[j][1];
    a=a+w*d1;
    b=b+2*r*k;
    c=c+h*d2;
    if (Math.abs(d1)==1){
      s1=0.4;
      s2=1;
    } else {
      s1=1;
      s2=0.4;
    }
    m=m.concat(stair(a,b,c,d1,d2,s1,s2,0.4*k,0,i));
    w=Math.floor(Math.random()*g)+g; // floor width
    h=Math.floor(Math.random()*g)+g; // floor height
    q=r*(i+2);
    a=a+(w+q)*d1;
    b=b+q*k;
    c=c+(h+q)*d2;
    m.push([0.5,0.5,0.5,a,b,c,w,r,h]); // add floor to m
    f.push([a,b,c,w,h]); // add floor to f
    for (p=0;p<4;p++){
      e=Math.floor(Math.random()*5);
      v1=v[p][0]*(Math.random()+2);
      v2=v[p][1]*(Math.random()+2);
      switch(e){
        case 0:
          m=m.concat(palm(a+v1,b+0.1,c+v2)); // add palm
          break;
        case 2:
          q=Math.floor(Math.random()*4); // random chair direction
          m=m.concat(chair(a+v1,b+0.1,c+v2,d[q][0],d[q][1])); // add chair
          break;
        case 3:
          m=m.concat(table(a+v1,b+0.1,c+v2)); // add table
          break;
        case 4:
          m=m.concat(pool(a+v1,b+0.1,c+v2)); // add pool
      }
    }
  }
}

// Game vars
acc=0.01; // player acceleration
jumpV=0.2; // player jump velocity
gravAcc=0.01; // gravity acceleration
maxV=0.1; // player max velocity
minV=0.01; // player min velocity
fric=0.9; // friction
vx=vy=vz=x=z=y=xn=yn=zn=0; // player velocity and position
eAcc=0.005; // cat acceleration
eMaxV=0.05; // cat max velocity
evx=evy=evz=0; // cat velocity
esx=a; // store cat start position
esy=b+1;
esz=c;
ex=exn=esx; // cat position
ey=eyn=esy;
ez=ezn=esz;
es=0.5; // cat size
o=0; // cat timer
et=0; // cat next event time
ed=100; // max frames between cat events
ea=0; // cat action
s=1; // player size
camX=camY=camZ=0; // camera position
camW=2; // camera const
onGround=true;
eOnGround=true;
t=0;
animRate=3;
catLives=9;
lowLim=-10;
gameOver=false;

// Update camera angle and re-render triangles every 16ms
setInterval(() => {

  resizeCanvasToDisplaySize(gl.canvas);
  gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);

  camVx=camVy=camVz=0; // camera translate speed

  // player control
  if (up){
    vz=vz-acc;
  }

  if (down){
    vz=vz+acc;
  }

  if (right){
    vx=vx+acc;
  }

  if (left){
    vx=vx-acc;
  }

  if (jump && onGround){
    vy=jumpV;
    onGround=false;
    zzfx(...[,,410,.04,.05,.07,1,1.8,,96,,,,.1,,,,.89,.05]); // Jump 1197
  }

  // restart if player falls down
  if (y<lowLim){
    location.reload(); 
  }

  // Game over if the player rescues the cat
  if (!gameOver && x+s>ex-es && x-s<ex+es && y+s>ey-es && y-s<ey+es && z+s>ez-es && z-s<ez+es){
    gameOver=true;
    document.getElementById("text").style.color = "red";
    document.getElementById("text").innerHTML = "&#10084 Good job &#10084 - Press R to play again";
    zzfx(...[1.2,,329,.07,.29,.34,1,1.1,,,141,.11,.06,,,.1,.09,.95,.21]); // Powerup 1317
  }

  // cat control
  o++;
  if (o>=et){
    et=et+ed*Math.random();
    ea=Math.floor(Math.random()*6); // update cat action  
  }
  switch(ea){
    case 0: 
      evx=evx+eAcc;
      break;
    case 1: 
      evx=evx-eAcc;
      break;
    case 2: 
      evz=evz+eAcc;
      break;
    case 3: 
      evz=evz-eAcc;
      break;
    case 4: 
      if (eOnGround){
        evy=jumpV;
        eOnGround=false;
      }
      break;
  }

  // reset cat if below y=-10
  if (ey<lowLim){
    evx=evy=evz=0; // cat velocity
    ex=exn=esx; // cat position
    ey=eyn=esy;
    ez=ezn=esz;
    if (!gameOver){
      catLives--;
      document.getElementById("text").innerHTML = catLives + " lives";
    }
    zzfx(...[1.9,,810,.36,,.15,1,5,,,-69,.12,.04,,,,.24,.55,.28,.17]); // Random 1313
    if (catLives<=0){
      location.reload();
    }
  }


  // update player new position
  vx=vx*fric;
  vy=vy-gravAcc;
  vz=vz*fric;
  vx=clamp(vx,-maxV,maxV);
  vy=clamp(vy,-jumpV,jumpV);
  vz=clamp(vz,-maxV,maxV);
  xn=x+vx;
  yn=y+vy;
  zn=z+vz; 

  // update cat new position
  evx=evx*fric;
  evy=evy-gravAcc;
  evz=evz*fric;
  evx=clamp(evx,-eMaxV,eMaxV);
  evy=clamp(evy,-jumpV,jumpV);
  evz=clamp(evz,-eMaxV,eMaxV);
  exn=ex+evx;
  eyn=ey+evy;
  ezn=ez+evz; 

  // Clear
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  // player blocking
  [bx,by,bz]=block(x,y,z,xn,yn,zn,s,s,s);

  // camera and player update
  tx=ty=tz=0;

  //  player x dir
  if (!bx){
    x=xn;
    if (x>camX+camW || x<camX-camW){
      tx=vx;
    }
  } else {
    xn=x;
    vx=0;
  }

  // player y dir
  if (!by){
    y=yn;
    if (y>camY+camW || y<camY-camW){
      ty=vy;
    }
  } else {
    yn=y;
    if (vy<0){
      onGround=true;
    }
    vy=0;
  }

  // player z dir
  if (!bz){
    z=zn;
    if (z>camZ+camW || z<camZ-camW){
      tz=vz;
    }
  } else {
    zn=z;
    vz=0;
  }

  // Move camera
  cameraMatrix.translateSelf(-tx,-ty,-tz);
  camX=camX+tx;
  camY=camY+ty;
  camZ=camZ+tz;

  // cat blocking
  [bx,by,bz]=block(ex,ey,ez,exn,eyn,ezn,es,es,es);

  // cat x dir
  if (!bx){
    ex=exn;
  } else {
    exn=ex;
    evx=0;
  }

  // cat y dir
  if (!by){
    ey=eyn;
  } else {
    eyn=ey;
    if (evy<0){
      eOnGround=true;
    }
    evy=0;
  }

  // cat z dir
  if (!bz){
    ez=ezn;
  } else {
    ezn=ez;
    evz=0;
  }

  // Player
  if (Math.abs(vx)>Math.abs(vz)){
    if (vx>0){
      d1=0; d2=1;
    } else {
      d1=0; d2=-1;
    }
  } else {
    if (vz>0){
      d1=1; d2=0;
    } else {
      d1=-1; d2=0;
    }
  }
  // player animation
  t=t+Math.max(Math.abs(vx),Math.abs(vz));
  renderObj(x,y,z,d1,d2,man(Math.sin(t*animRate)));

  // Cat - get general motion direction and draw
  if (Math.abs(evx)>Math.abs(evz)){
    if (evx>0){
      d1=0; d2=1;
    } else {
      d1=0; d2=-1;
    }
  } else {
    if (evz>0){
      d1=1; d2=0;
    } else {
      d1=-1; d2=0;
    }
  }
  renderObj(ex,ey+0.5,ez,d1,d2,cat());
}, 16);


</script>
